<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILTEC Jobs</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:25px 20px 15px;border-bottom:1px solid #333}h1{font-size:36px;letter-spacing:5px;margin:0}small{color:#aaa}.wrap{max-width:750px;margin:auto;padding:18px}input,button{font:inherit;border-radius:9px;padding:14px}input{width:100%;background:#222;color:white;border:1px solid #555}button{background:#fff;color:#111;border:0;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}.card{background:#1a1a1a;border:1px solid #383838;border-radius:12px;padding:17px;margin:12px 0;cursor:pointer}.muted{color:#aaa;font-size:13px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none}a{color:#fff}img{max-width:100%;border-radius:8px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center}.back{background:#333;color:white}label{display:block;margin:14px 0 7px}.pill{font-size:12px;color:#aaa} .preview{max-height:65vh;object-fit:contain}
</style></head><body><header><h1>ILTEC</h1><small>ELECTRICAL · JOB LIBRARY</small></header><main class="wrap">
<section id="home"><input id="search" placeholder="🔎 Search job, address or builder…" oninput="renderJobs()"><div class="row"><h3>All jobs</h3><span class="pill" id="count"></span></div><div id="jobs"></div><button onclick="showAdmin()">Office dashboard</button></section>
<section id="detail" class="hidden"><button class="back" onclick="showHome()">← All jobs</button><h2 id="jobtitle"></h2><p class="muted" id="jobinfo"></p><div class="tabs"><button onclick="setTab('plans')">Plans</button><button onclick="setTab('photos')">Photos</button></div><div id="contents"></div><div id="photoadd" class="hidden"><label>Add site photos</label><input type="file" accept="image/*" multiple id="photosInput"><button onclick="addFiles('photo')">Upload photos</button></div></section>
<section id="admin" class="hidden"><button class="back" onclick="showHome()">← All jobs</button><h2>Office dashboard</h2><p class="muted">Demo admin area — production version requires separate secure office access.</p><label>Job name / lot</label><input id="newname" placeholder="Lot 106 – Example Street"><label>Builder</label><input id="newbuilder" placeholder="Builder name"><label>Address</label><input id="newaddress" placeholder="Site address"><button onclick="addJob()">Add job</button><hr style="border-color:#333;margin:25px 0"><label>Choose job for plans</label><select id="adminjob" style="width:100%;padding:14px"></select><label>Upload plans (PDF or images)</label><input id="plansInput" type="file" accept=".pdf,image/*" multiple><button onclick="addFiles('plan')">Upload plans</button></section>
</main><script>
const KEY='iltec-demo-v1';let jobs=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:1,name:'Lot 105 – Penny Street',builder:'Brett Harvey Construction',address:'Ellida Estate',plans:[],photos:[]},{id:2,name:'Lot 106 – Sample Job',builder:'Example Builder',address:'Gold Coast QLD',plans:[],photos:[]}];let current=1,tab='plans';function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){alert('Storage is full. This demo only stores small files locally.')}}function sections(id){for(const x of ['home','detail','admin'])document.getElementById(x).classList.toggle('hidden',x!==id)}function renderJobs(){const q=document.getElementById('search').value.toLowerCase();const matches=jobs.filter(j=>(j.name+' '+j.builder+' '+j.address).toLowerCase().includes(q));document.getElementById('count').textContent=matches.length+' jobs';document.getElementById('jobs').innerHTML=matches.map(j=>`<div class="card" onclick="openJob(${j.id})"><strong>${esc(j.name)}</strong><p class="muted">${esc(j.builder)} · ${esc(j.address)}</p><span class="pill">${j.plans.length} plans · ${j.photos.length} photos</span></div>`).join('')||'<p>No matching jobs.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showHome(){sections('home');renderJobs()}function openJob(id){current=id;sections('detail');const j=jobs.find(x=>x.id===id);document.getElementById('jobtitle').textContent=j.name;document.getElementById('jobinfo').textContent=j.builder+' · '+j.address;setTab('plans')}function setTab(t){tab=t;const j=jobs.find(x=>x.id===current);document.getElementById('photoadd').classList.toggle('hidden',t!=='photos');const files=t==='plans'?j.plans:j.photos;document.getElementById('contents').innerHTML=files.length?files.map((f,i)=>`<div class="card"><strong>${esc(f.name)}</strong><br>${f.data.startsWith('data:image/')?`<img class="preview" src="${f.data}">`:''}<p><a href="${f.data}" target="_blank" download="${esc(f.name)}">Open / download</a></p></div>`).join(''):'<p class="muted">Nothing uploaded yet.</p>'}function showAdmin(){sections('admin');document.getElementById('adminjob').innerHTML=jobs.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('')}function addJob(){let name=document.getElementById('newname').value.trim();if(!name)return alert('Enter a job name');jobs.push({id:Date.now(),name,builder:document.getElementById('newbuilder').value,address:document.getElementById('newaddress').value,plans:[],photos:[]});save();showAdmin();alert('Job added')}function addFiles(kind){let inp=document.getElementById(kind==='photo'?'photosInput':'plansInput'),id=kind==='photo'?current:Number(document.getElementById('adminjob').value),j=jobs.find(x=>x.id===id);if(!inp.files.length)return alert('Choose files first');let files=[...inp.files],done=0;files.forEach(file=>{if(file.size>1500000){alert(file.name+' is too large for this local demo (1.5 MB limit).');return}let r=new FileReader();r.onload=()=>{j[kind==='photo'?'photos':'plans'].push({name:file.name,data:r.result});save();if(kind==='photo')setTab('photos');done++};r.readAsDataURL(file)});inp.value=''}
renderJobs();
</script></body></html>
